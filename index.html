      </div>

      <button class="enter-button hold-button" id="enterButton" type="button" aria-label="Przytrzymaj, aby odkryć Biżufitting" aria-disabled="false">
        <span class="hold-button-label">PRZYTRZYMAJ, ABY ODKRYĆ</span>
        <span class="hold-button-stroke-shell" aria-hidden="true">
          <span class="hold-button-ink" aria-hidden="true"></span>
          <svg class="hold-button-stroke" viewBox="0 0 260 18" focusable="false">

    <div class="ink-matte__origin ink-matte__origin--right" data-ink-origin-right></div>
    <div class="ink-matte__field" data-ink-field-left>
      <div class="ink-matte__stage" data-ink-stage-left></div>
    </div>
    <div class="ink-matte__field" data-ink-field-right>
      <div class="ink-matte__stage" data-ink-stage-right></div>
    </div>

  <div class="matte-fallback" id="matteFallback" aria-hidden="true"></div>
  <main class="experience" id="experience" tabindex="-1" hidden>
    <section class="story-camera" id="storyCamera" aria-label="Interaktywna opowieść Biżufitting">
      <div class="story-stage" id="storyStage" aria-hidden="true">
        <div class="story-world" id="storyWorld">
          <img
            class="story-world__image"
            id="storyMasterImage"
            src="./assets/story/master-scene-v0.1.20-r8.8.webp"
            width="1448"
            height="1086"
            alt=""
            decoding="async"
          />
        </div>
        <div class="story-stage__paper-fade" aria-hidden="true"></div>
      </div>

      <section class="story-panel" id="storyPanel" aria-live="polite">
        <div class="story-panel__meta">
          <p class="story-panel__kicker">
            <span id="storyStep">01</span> / <span id="storySection">Historia</span>
          </p>
          <div class="story-progress" id="storyProgress" aria-hidden="true">
            <span class="is-active"></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="story-panel__body">
          <div class="story-panel__copy">
            <h2 id="storyTitle">Początek opowieści</h2>
            <p id="storyText">Każdy detal może stać się początkiem własnej historii.</p>
          </div>

          <button class="story-next" id="storyNext" type="button" aria-label="Przejdź do kolejnego kadru">
            <span id="storyNextIcon" aria-hidden="true">→</span>
          </button>
        </div>
      </section>
    </section>
  </main>

  <script src="./src/hold-cta.js?v=0.1.20-r8.10" defer></script>
  <script src="./src/matte-transition.js?v=0.1.20-r8.10" defer></script>
  <script src="./src/app.js?v=0.1.20-r8.10" defer></script>
